name: CI and Semantic Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Releases run one at a time, so two merges cannot calculate the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Version check on pull requests, and tagging on main, are run by the central release workflow.
  release:
    uses: venkatjk/central-release/.github/workflows/release.yml@main
    permissions:
      contents: write
